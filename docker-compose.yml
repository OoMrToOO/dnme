services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-now}
    volumes:
      - nova_pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://nova:${POSTGRES_PASSWORD:-change-me-now}@db:5432/nova
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  nova_pg:
